<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Resizer & Tool</title>
    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background: #f4f7f6; padding: 20px; display: flex; justify-content: center; }
        .card { background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 20px; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="file"], select, input[type="number"] { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 5px; }
        .row { display: flex; gap: 10px; }
        button { width: 100%; padding: 12px; background: #27ae60; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; margin-top: 10px; }
        button:hover { background: #219150; }
        .preview-box { text-align: center; margin-top: 20px; }
        img { max-width: 100%; max-height: 250px; border: 1px solid #ddd; margin-top: 10px; border-radius: 5px; }
    </style>
</head>
<body>

<div class="card">
    <h2>CSC Photo Tool</h2>
    
    <div class="input-group">
        <label>Photo Upload Karein:</label>
        <input type="file" id="upload" accept="image/*">
    </div>

    <div class="input-group">
        <label>Preset Size Chunein:</label>
        <select id="preset" onchange="applyPreset()">
            <option value="custom">Custom Size</option>
            <option value="passport">Passport Size (35 x 45 mm / 413x531 px)</option>
            <option value="stamp">Stamp Size (20 x 25 mm / 236x295 px)</option>
            <option value="signature">Signature (300 x 120 px)</option>
        </select>
    </div>

    <div class="row">
        <div class="input-group" style="flex: 1;">
            <label>Width (px):</label>
            <input type="number" id="width" placeholder="Width">
        </div>
        <div class="input-group" style="flex: 1;">
            <label>Height (px):</label>
            <input type="number" id="height" placeholder="Height">
        </div>
    </div>

    <button onclick="processImage()">Process & Resize</button>

    <div class="preview-box" id="previewBox" style="display:none;">
        <h3>Preview</h3>
        <canvas id="canvas" style="display:none;"></canvas>
        <img id="outputImage" src="" alt="Resized Photo">
        <br><br>
        <a id="downloadBtn" download="resized_photo.jpg">
            <button style="background: #2980b9;">Download Photo</button>
        </a>
    </div>
</div>

<script>
    const upload = document.getElementById('upload');
    const widthInput = document.getElementById('width');
    const heightInput = document.getElementById('height');
    const preset = document.getElementById('preset');
    const canvas = document.getElementById('canvas');
    const outputImage = document.getElementById('outputImage');
    const previewBox = document.getElementById('previewBox');
    const downloadBtn = document.getElementById('downloadBtn');

    function applyPreset() {
        const val = preset.value;
        if (val === 'passport') {
            widthInput.value = 413;
            heightInput.value = 531;
        } else if (val === 'stamp') {
            widthInput.value = 236;
            heightInput.value = 295;
        } else if (val === 'signature') {
            widthInput.value = 300;
            heightInput.value = 120;
        }
    }

     function processImage() {
        if (!upload.files[0]) {
            alert('Kripya pehle photo select karein!');
            return;
        }

        const file = upload.files[0];
        const reader = new FileReader();

        reader.onload = function(e) {
            const img = new Image();
            img.src = e.target.result;

            img.onload = function() {
                const targetW = widthInput.value || img.width;
                const targetH = heightInput.value || img.height;

                canvas.width = targetW;
                canvas.height = targetH;

                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, targetW, targetH);

                const dataUrl = canvas.toDataURL('image/jpeg', 0.9);
                outputImage.src = dataUrl;
                downloadBtn.href = dataUrl;
                previewBox.style.display = 'block';
            }
        }
        reader.readAsDataURL(file);
    }
</script>

</body>
</html>
